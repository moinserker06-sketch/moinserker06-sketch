<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🏠 House Rent Dashboard 2026</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(120deg, #f4f6f9, #e2e8f0);
    margin: 0;
    padding: 0;
}
header {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
.container {
    width: 95%;
    max-width: 1200px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
}
.container:hover {
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}
h3 {
    margin-top: 0;
    color: #1e3a8a;
}
.form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 15px;
}
input, select {
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    flex: 1 1 150px;
    font-size: 14px;
    transition: border 0.3s ease;
}
input:focus, select:focus {
    border-color: #2563eb;
    outline: none;
}
button {
    padding: 10px 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s ease;
}
button:hover {
    background: #1d4ed8;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 25px;
}
th {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    color: white;
    padding: 12px;
    font-size: 14px;
    text-transform: uppercase;
}
td {
    padding: 10px;
    border-bottom: 1px solid #e2e8f0;
    text-align: center;
    font-size: 14px;
    transition: background 0.2s ease;
}
tr:hover {
    background: #f1f5f9;
}
.paid {
    color: green;
    font-weight: bold;
}
.due {
    color: red;
    font-weight: bold;
}
.delete-btn {
    background: #ef4444;
    border-radius: 4px;
    padding: 5px 10px;
}
.delete-btn:hover {
    background: #b91c1c;
}
.summary {
    margin-top: 20px;
    font-weight: bold;
    font-size: 16px;
}
.status-icon {
    font-size: 18px;
    margin-right: 5px;
}
</style>
</head>
<body>

<header>🏠 House Rent Dashboard 2026</header>

<div class="container">

<h3>Add New Entry</h3>
<div class="form-row">
    <select id="month">
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
    </select>
    <input type="text" id="name" placeholder="Tenant Name">
    <input type="text" id="phone" placeholder="Phone">
    <input type="text" id="flat" placeholder="Flat No">
    <input type="number" id="rent" placeholder="Rent Amount">
    <select id="status">
        <option value="Paid">Paid</option>
        <option value="Due">Due</option>
    </select>
    <button onclick="addEntry()">💾 Save</button>
</div>

<table>
<thead>
<tr>
<th>Month</th>
<th>Name</th>
<th>Phone</th>
<th>Flat</th>
<th>Rent</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<div class="summary">
Total Rent Collected: <span id="totalPaid">0</span> |
Total Due: <span id="totalDue">0</span>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("rentData")) || [];

function saveData() {
    localStorage.setItem("rentData", JSON.stringify(data));
}

function addEntry() {
    let entry = {
        month: document.getElementById("month").value,
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        flat: document.getElementById("flat").value.trim(),
        rent: parseInt(document.getElementById("rent").value),
        status: document.getElementById("status").value
    };

    if(!entry.name || !entry.rent) {
        alert("Please fill required fields");
        return;
    }

    data.push(entry);
    saveData();
    renderTable();
    clearForm();
}

function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("flat").value = "";
    document.getElementById("rent").value = "";
    document.getElementById("status").value = "Paid";
}

function deleteEntry(index) {
    if(confirm("Are you sure you want to delete this entry?")) {
        data.splice(index, 1);
        saveData();
        renderTable();
    }
}

function renderTable() {
    let table = document.getElementById("tableBody");
    table.innerHTML = "";

    let totalPaid = 0;
    let totalDue = 0;

    data.forEach((item, index) => {
        totalPaid += item.status === "Paid" ? item.rent : 0;
        totalDue += item.status === "Due" ? item.rent : 0;

        table.innerHTML += `
        <tr>
            <td>${item.month}</td>
            <td>${item.name}</td>
            <td>${item.phone}</td>
            <td>${item.flat}</td>
            <td>${item.rent}</td>
            <td class="${item.status === 'Paid' ? 'paid' : 'due'}">
                <span class="status-icon">${item.status === 'Paid' ? '✅' : '⏳'}</span>${item.status}
            </td>
            <td><button class="delete-btn" onclick="deleteEntry(${index})">🗑️ Delete</button></td>
        </tr>`;
    });

    document.getElementById("totalPaid").innerText = totalPaid;
    document.getElementById("totalDue").innerText = totalDue;
}

renderTable();
</script>

</body>
</html>
